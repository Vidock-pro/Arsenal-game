function newGame(country,now=Date.now()){

 return {version:1,country,credits:700,resources:{coal:70,wood:100,iron:90,platinum:0,rubber:0},levels:{coal:1,wood:1,iron:1,platinum:0,rubber:0},tech:[],research:null,patents:[],lines:PRODUCTS.map(p=>({id:p.id,enabled:false,remaining:0,stock:0,made:0})),totalSold:0,lastSaved:now,elapsed:0};
}
const capacity=s=>s.tech.includes('logistics')?10000:5000;
const unlocked=(s,r)=>!r.tech||s.tech.includes(r.tech);
const rate=(s,r)=>unlocked(s,r)?r.rate*s.levels[r.id]*(s.country==='su'?1.2:1)*(s.tech.includes('steam')?1.2:1)*(s.tech.includes('logistics')?1.25:1):0;
const upgradeCost=(s,r)=>Math.floor(r.cost*1.65**s.levels[r.id]);
const researchTime=(s,t)=>t.time/(s.country==='fr'?1.2:1);
const productTime=(s,p)=>p.time/(s.country==='de'?1.15:1)/(s.tech.includes('assembly')?1.25:1);
const salePrice=(s,p)=>Math.floor(p.value*(s.tech.includes('series')?1.25:1));
const affordable=(s,cost)=>Object.entries(cost).every(([k,v])=>s.resources[k]>=v);
function advance(s,seconds){
 let left=Math.max(0,Math.min(28800,Number(seconds)||0));
 while(left>1e-8){const dt=Math.min(1,left);left-=dt;s.elapsed+=dt;
 for(const r of RESOURCES)s.resources[r.id]=Math.min(capacity(s),s.resources[r.id]+rate(s,r)*dt);
 s.credits+=PATENTS.filter(p=>s.patents.includes(p.id)).reduce((a,p)=>a+p.income,0)*dt;
 if(s.research){s.research.remaining-=dt;if(s.research.remaining<=0){s.tech.push(s.research.id);s.research=null;}}
 for(const line of s.lines){const p=PRODUCTS.find(x=>x.id===line.id);if(!line.enabled||(p.unlock&&!s.tech.includes(p.unlock)))continue;
 if(line.remaining<=0){if(line.stock>=9999||!affordable(s,p.recipe))continue;for(const [k,v]of Object.entries(p.recipe))s.resources[k]-=v;line.remaining=productTime(s,p);}
 line.remaining-=dt;if(line.remaining<=1e-8){line.remaining=0;line.stock++;line.made++;}
 }
 }return s;
}
function act(s,type,id){
 if(type==='harvest'){const r=RESOURCES.find(r=>r.id===id);if(!r||!unlocked(s,r))return false;s.resources[id]=Math.min(capacity(s),s.resources[id]+5);return true;}
 if(type==='upgrade'){const r=RESOURCES.find(r=>r.id===id);if(!r||!unlocked(s,r)||s.credits<upgradeCost(s,r))return false;s.credits-=upgradeCost(s,r);s.levels[id]++;return true;}
 if(type==='research'){const t=TECHS.find(t=>t.id===id);if(!t||s.research||s.tech.includes(id)||!t.requires.every(k=>s.tech.includes(k))||s.credits<t.cost)return false;s.credits-=t.cost;s.research={id,remaining:researchTime(s,t)};return true;}
 if(type==='patent'){const p=PATENTS.find(p=>p.id===id);if(!p||!s.tech.includes(id)||s.patents.includes(id)||s.credits<p.cost)return false;s.credits-=p.cost;s.patents.push(id);return true;}
 if(type==='toggle'){const l=s.lines.find(l=>l.id===id),p=PRODUCTS.find(p=>p.id===id);if(!l||(p.unlock&&!s.tech.includes(p.unlock)))return false;l.enabled=!l.enabled;return true;}
 if(type==='sell'){const l=s.lines.find(l=>l.id===id),p=PRODUCTS.find(p=>p.id===id);if(!l||!l.stock)return false;s.credits+=l.stock*salePrice(s,p);s.totalSold+=l.stock;l.stock=0;return true;}
 return false;
}
function validateSave(raw){
 const s=typeof raw==='string'?JSON.parse(raw):structuredClone(raw);
 const finite=(n,max=1e12)=>typeof n==='number'&&Number.isFinite(n)&&n>=0&&n<=max;
 const unique=a=>new Set(a).size===a.length;
 if(!s||s.version!==1||!COUNTRIES[s.country]||!finite(s.credits)||!finite(s.elapsed)||!finite(s.totalSold)||!finite(s.lastSaved,Date.now()+60000))throw Error('Sauvegarde invalide');
 for(const r of RESOURCES)if(!finite(s.resources?.[r.id],10000)||!Number.isInteger(s.levels?.[r.id])||s.levels[r.id]<0||s.levels[r.id]>100)throw Error('Ressources invalides');
 for(const key of ['tech','patents'])if(!Array.isArray(s[key])||!unique(s[key])||s[key].some(id=>!TECHS.some(t=>t.id===id)))throw Error('Technologies invalides');
 if(s.tech.some(id=>!TECHS.find(t=>t.id===id).requires.every(k=>s.tech.includes(k)))||s.patents.some(id=>!s.tech.includes(id)))throw Error('Progression incohérente');
 if(s.research&&(!TECHS.some(t=>t.id===s.research.id)||s.tech.includes(s.research.id)||!finite(s.research.remaining,200)||!TECHS.find(t=>t.id===s.research.id).requires.every(k=>s.tech.includes(k))))throw Error('Recherche invalide');
 if(!Array.isArray(s.lines)||s.lines.length!==3||!unique(s.lines.map(l=>l.id)))throw Error('Lignes invalides');
 for(const l of s.lines)if(!PRODUCTS.some(p=>p.id===l.id)||typeof l.enabled!=='boolean'||!finite(l.remaining,120)||!Number.isInteger(l.stock)||!finite(l.stock,9999)||!Number.isInteger(l.made)||!finite(l.made))throw Error('Production invalide');
 return s;
}

const $=s=>document.querySelector(s),KEY='arsenal.save.v1';

const fmt=n=>Math.floor(n).toLocaleString('fr-FR');
const dec=n=>n.toLocaleString('fr-FR',{maximumFractionDigits:1});
const clock=n=>`${Math.floor(Math.max(0,n)/60).toString().padStart(2,'0')}:${Math.ceil(Math.max(0,n)%60).toString().padStart(2,'0')}`;

const icons={harvest:'⚒',production:'⚙',research:'⚗',patents:'▤',storage:'▥'};
function notify(t){$('#toast').textContent=t;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),3500);}
function save(){if(!state)return;try{state.lastSaved=Date.now();localStorage.setItem(KEY,JSON.stringify(state));saved=true;}catch{saved=false;}}
let offlineMessage='';try{const raw=localStorage.getItem(KEY);if(raw){state=validateSave(raw);const elapsed=Math.min(28800,Math.max(0,(Date.now()-state.lastSaved)/1000));advance(state,elapsed);if(elapsed>60)offlineMessage=`Vos ateliers ont travaillé ${Math.floor(elapsed/60)} min pendant votre absence.`;save();}}catch{offlineMessage='La sauvegarde locale est illisible. Vous pouvez importer une copie ou commencer une nouvelle partie.';}

function goal(){if(!state.lines.some(l=>l.enabled||l.made))return 'Première mission : ouvrez Production et lancez votre atelier de fusils.';if(!state.totalSold)return 'Première livraison : vendez votre premier lot dans Production.';if(state.research)return 'Vos ingénieurs travaillent. Continuez à produire pour financer la prochaine avancée.';if(!state.tech.length)return 'Investissez vos revenus : lancez Machines à vapeur dans Recherche.';if(!state.patents.length)return 'Protégez votre première invention dans Brevets pour toucher des revenus passifs.';return 'Développez vos ateliers, financez les recherches et débloquez les blindés.';}
function shell(){screen='game';const c=COUNTRIES[state.country];$('#app').innerHTML=`<div class="game-shell"><header class="topbar"><button class="wordmark" data-action="home">ARSENAL<small>LES INDUSTRIES DE GUERRE</small></button><div class="nation-label">${flag(state.country)}<span>${c.name}<small>${c.bonus}</small></span></div><div class="wallet"><span>◉</span><div><small>TRÉSORERIE</small><strong id="credits"></strong></div></div><button class="icon-btn" data-action="settings" aria-label="Sauvegarde et paramètres">☰</button></header><aside class="sidebar"><div class="sidebar-label">COMPLEXE INDUSTRIEL</div><nav>${Object.entries(names).map(([id,name])=>`<button data-view="${id}" class="${view===id?'active':''}"><span>${icons[id]}</span>${name}<b>${id==='research'&&state.research?'•':''}</b></button>`).join('')}</nav><div class="sidebar-bottom"><div class="live-dot">USINE OPÉRATIONNELLE</div><p>L’avenir appartient<br>à ceux qui le fabriquent.</p><a href="README.md">↗ Code source · MIT</a><button data-action="home">← Écran titre</button></div></aside><main class="workspace"><div class="page-heading"><div><p class="eyebrow">DIRECTION DES OPÉRATIONS / <span>${String(Object.keys(names).indexOf(view)+1).padStart(2,'0')}</span></p><h1>${({harvest:'Récolte des ressources',production:'Ateliers de production',research:'Bureau de recherche',patents:'Bureau des brevets',storage:'Magasins & réserves'})[view]}</h1></div><span class="date-badge">CAMPAGNE INDUSTRIELLE<br><strong>1936</strong></span></div><div class="mission"><span>ORDRE DU JOUR</span><p>${goal()}</p></div><div id="content"></div><footer class="game-footer"><span id="save-status">● Sauvegarde automatique</span><span>ARSENAL / VERSION 0.1 · ÉCONOMIE FICTIVE</span></footer></main></div>`;renderContent();updateNumbers();}
function harvest(){return `<div class="section-intro"><p>Les matières premières de votre puissance industrielle.</p><span>CAPACITÉ PAR RESSOURCE · ${fmt(capacity(state))}</span></div><div class="resource-grid">${RESOURCES.map((r,i)=>{const lock=!unlocked(state,r);return `<article class="resource-card ${lock?'locked':''}"><header><span class="serial">EXPLOITATION / 0${i+1}</span><span class="level" id="level-${r.id}">NIV. ${state.levels[r.id]}</span></header>${art('harvest',r.x,r.y,r.w,r.h)}<div class="resource-info"><div class="resource-title"><h2>${r.name}</h2><span>${r.icon}</span></div><p>${r.desc}</p>${lock?`<div class="lock-info">⌑ Recherche requise : ${TECHS.find(t=>t.id===r.tech).name}</div><button class="secondary full" data-view="research">Ouvrir la recherche →</button>`:`<div class="stock-row"><div><small>EN RÉSERVE</small><strong id="stock-${r.id}"></strong></div><span class="rate" id="rate-${r.id}"></span></div><div class="meter"><i id="bar-${r.id}"></i></div><div class="card-actions"><button class="secondary" data-action="harvest" data-id="${r.id}">Récolter +5</button><button class="upgrade" data-action="upgrade" data-id="${r.id}" id="upgrade-${r.id}"></button></div>`}</div></article>`;}).join('')}<article class="next-card"><span>✦</span><p>L’INDUSTRIE DE DEMAIN</p><h2>Investissez dans<br>la connaissance.</h2><p>De nouveaux procédés ouvrent de nouvelles possibilités.</p><button class="secondary" data-view="research">Bureau de recherche →</button></article></div>`;}
function vehicle(id){if(id==='rifle')return `<svg viewBox="0 0 360 110" aria-hidden="true"><path fill="#604936" stroke="#201b13" stroke-width="5" d="M20 63h85l45-12h130v17H150l-32 19-18-5-22 9-58 12z"/><path fill="#87877b" d="M143 43h142v12H143zm134 4h65v7h-65zM177 55h6v27h-6z"/><path fill="#383a31" d="M137 61h27v15h-27zm99-25h9v10h-9z"/></svg>`;if(id==='truck')return `<svg viewBox="0 0 360 160" aria-hidden="true"><path fill="#666649" stroke="#24291f" stroke-width="5" d="M34 37h182v89H34zM224 72h51l31 28h24v26H224z"/><path fill="#222c27" d="M240 80h28l20 21h-48z"/><path fill="none" stroke="#969478" stroke-width="3" d="M67 38v71m36-71v71m36-71v71m36-71v71"/><g fill="#23251f" stroke="#9a9276" stroke-width="9"><circle cx="78" cy="129" r="21"/><circle cx="182" cy="129" r="21"/><circle cx="284" cy="129" r="21"/></g></svg>`;return `<svg viewBox="0 0 360 160" aria-hidden="true"><path fill="#656a43" stroke="#252d21" stroke-width="5" d="M28 100l27-22h229l32 28-17 32H43zM108 75l15-42h83l27 42z"/><path fill="#777b52" d="M204 47h118v10H204z"/><path stroke="#252d21" stroke-width="22" d="M62 127h221"/><g fill="#696e4b" stroke="#a2a37b" stroke-width="3">${[63,106,149,192,235,278].map(x=>`<circle cx="${x}" cy="126" r="15"/>`).join('')}</g></svg>`;}
function production(){return `<div class="section-intro"><p>Transformez vos matières en équipements. Vendez les lots pour financer votre expansion.</p></div><div class="production-list">${PRODUCTS.map((p,i)=>{let l=state.lines[i],lock=p.unlock&&!state.tech.includes(p.unlock);return `<article class="production-card ${lock?'locked':''}"><div class="product-art"><span class="serial">ATELIER 0${i+1} / ${p.kind}</span>${vehicle(p.id)}<span class="blueprint-label">PLAN D’ENSEMBLE · ${COUNTRIES[state.country].icon} / 0${i+1}</span></div><div class="product-details"><div class="product-heading"><h2>${COUNTRIES[state.country].units[i]}</h2><span id="status-${p.id}" class="status"></span></div><div class="recipe">${Object.entries(p.recipe).map(([k,v])=>`<span>${RESOURCES.find(r=>r.id===k).icon} ${v} ${RESOURCES.find(r=>r.id===k).name}</span>`).join('')}</div>${lock?`<p>Recherche requise : ${TECHS.find(t=>t.id===p.unlock).name}</p><button class="secondary" data-view="research">Ouvrir la recherche →</button>`:`<div class="production-stats"><span>${dec(productTime(state,p))} s / unité</span><span>${fmt(salePrice(state,p))} crédits / unité</span><span id="made-${p.id}"></span></div><div class="meter"><i id="progress-${p.id}"></i></div><div class="card-actions"><button class="secondary" data-action="toggle" data-id="${p.id}" id="toggle-${p.id}"></button><button class="upgrade" data-action="sell" data-id="${p.id}" id="sell-${p.id}"></button></div>`}</div></article>`;}).join('')}</div>`;}
function research(){return `<div class="section-intro"><p>Un bureau, six avancées. Chaque invention transforme votre industrie.</p><span>UN PROJET À LA FOIS</span></div><div class="tech-grid">${TECHS.map((t,i)=>{let done=state.tech.includes(t.id),running=state.research?.id===t.id,ready=t.requires.every(k=>state.tech.includes(k));return `<article class="tech-card ${done?'completed':''} ${!ready?'locked':''}">${art('research',t.x,t.y,t.w,t.h)}<div class="resource-info"><span class="serial">DOSSIER R–0${i+1} / ${done?'VALIDÉ':running?'EN COURS':'RECHERCHE'}</span><h2>${t.name}</h2><p>${t.desc}</p><div class="tech-requirements">${t.requires.length?'Prérequis : '+t.requires.map(k=>TECHS.find(x=>x.id===k).name).join(', '):'Aucun prérequis'}</div>${done?'<div class="done-label">✓ Technologie maîtrisée</div>':running?`<div class="meter"><i id="research-bar"></i></div><div class="research-time" id="research-time"></div>`:`<button class="upgrade full" data-action="research" data-id="${t.id}" id="research-${t.id}" ${!ready?'disabled':''}>Rechercher · ${fmt(t.cost)} ◉ <small>${clock(researchTime(state,t))}</small></button>`}</div></article>`;}).join('')}</div>`;}
function patents(){return `<div class="section-intro"><p>Déposez vos inventions pour accorder des licences et toucher des redevances automatiques.</p><span id="patent-rate"></span></div><div class="patent-grid">${PATENTS.map((p,i)=>{const owns=state.patents.includes(p.id),ready=state.tech.includes(p.id);return `<article class="patent-card ${!ready?'patent-locked':''}"><div class="paper-top"><span>RÉPUBLIQUE INDUSTRIELLE</span><span>N° 00${42+i}</span></div><h2>${p.name}</h2><div class="patent-seal">${['⚙','⚒','⬡','⚗','▥','⚙'][i]}</div><p>Certificat d’exploitation industrielle</p><div class="stamp ${owns?'owned':''}">${owns?'DÉPOSÉ':ready?'À DÉPOSER':'VERROUILLÉ'}</div><div class="patent-benefit">Redevances <strong>+ ${dec(p.income*60)} ◉ / min</strong></div>${owns?'<span class="license-active">✓ Licence active · revenus automatiques</span>':ready?`<button class="paper-button" data-action="patent" data-id="${p.id}" id="patent-${p.id}">Déposer le brevet · ${fmt(p.cost)} ◉</button>`:`<button class="paper-button" data-view="research">Recherche requise →</button>`}</article>`;}).join('')}</div>`;}
function storage(){return `<div class="section-intro"><p>Vos matières premières et vos équipements disponibles.</p><span>CAPACITÉ · ${fmt(capacity(state))} / RESSOURCE</span></div><section class="storage-panel"><h2>Registre des matières premières</h2>${RESOURCES.map(r=>`<div class="inventory-row"><span>${r.icon} ${r.name}</span><div class="meter"><i id="bar-${r.id}"></i></div><strong id="stock-${r.id}"></strong><small id="rate-${r.id}"></small></div>`).join('')}</section><section class="storage-panel"><h2>Équipements prêts à livrer</h2>${PRODUCTS.map((p,i)=>`<div class="inventory-row"><span>${COUNTRIES[state.country].units[i]}</span><strong id="warehouse-${p.id}"></strong><button class="upgrade" data-action="sell" data-id="${p.id}" id="sell-${p.id}"></button></div>`).join('')}</section>`;}

function updateNumbers(){if(screen!=='game')return;text('credits',fmt(state.credits));text('save-status',saved?'● Sauvegarde automatique':'⚠ Sauvegarde indisponible · exportez votre partie');for(const r of RESOURCES){text('stock-'+r.id,fmt(state.resources[r.id]));text('rate-'+r.id,`+ ${dec(rate(state,r)*60)} / min`);text('level-'+r.id,`NIV. ${state.levels[r.id]}`);text('upgrade-'+r.id,`${state.levels[r.id]?'Améliorer':'Exploiter'} · ${fmt(upgradeCost(state,r))} ◉`);disable('upgrade-'+r.id,state.credits<upgradeCost(state,r));width('bar-'+r.id,state.resources[r.id]/capacity(state)*100);}
 for(const p of PRODUCTS){const l=state.lines.find(l=>l.id===p.id);text('status-'+p.id,l.enabled?(l.remaining>0?'EN PRODUCTION':affordable(state,p.recipe)?'DÉMARRAGE':'MATIÈRES MANQUANTES'):'À L’ARRÊT');text('toggle-'+p.id,l.enabled?'Ⅱ Suspendre':'▶ Lancer la production');text('sell-'+p.id,`Vendre ${l.stock} · ${fmt(l.stock*salePrice(state,p))} ◉`);disable('sell-'+p.id,!l.stock);text('made-'+p.id,`${l.made} unités fabriquées`);text('warehouse-'+p.id,`${l.stock} en stock`);width('progress-'+p.id,l.remaining>0?100*(1-l.remaining/productTime(state,p)):0);}
 for(const t of TECHS)disable('research-'+t.id,!!state.research||state.credits<t.cost||!t.requires.every(k=>state.tech.includes(k)));
 if(state.research){const t=TECHS.find(t=>t.id===state.research.id);width('research-bar',100*(1-state.research.remaining/researchTime(state,t)));text('research-time',`${clock(state.research.remaining)} · Recherche en cours`);}
 for(const p of PATENTS)disable('patent-'+p.id,state.credits<p.cost);text('patent-rate',`REDEVANCES · + ${dec(PATENTS.filter(p=>state.patents.includes(p.id)).reduce((a,p)=>a+p.income*60,0))} ◉ / MIN`);
}
function settings(){const d=document.createElement('dialog');d.innerHTML=`<form method="dialog"><div class="modal-header"><h2>Archives de l’industrie</h2><button class="icon-btn" aria-label="Fermer">×</button></div><p>Votre partie est sauvegardée dans ce navigateur. Exportez-la pour changer d’appareil ou conserver une copie.</p><div class="modal-actions"><button type="button" class="primary" data-action="export">Exporter la sauvegarde</button><button type="button" class="secondary" data-action="import">Importer une sauvegarde</button><a class="secondary" href="README.md">Télécharger le code source ↗</a></div><p class="small">Progression hors ligne limitée à 8 heures. La production consomme les ressources ; vendez vos lots pour gagner des crédits. Les brevets rapportent automatiquement.</p><button class="secondary full">Retour à l’usine</button></form>`;document.body.append(d);d.addEventListener('close',()=>d.remove());d.showModal();}
function download(){save();const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=`arsenal-${state.country}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Sauvegarde exportée.');}
function importSave(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{try{const file=input.files[0];if(!file||file.size>100000)throw Error();const next=validateSave(await file.text());if(state&&!confirm('Remplacer votre partie actuelle par cette sauvegarde ?'))return;state=next;advance(state,Math.max(0,(Date.now()-state.lastSaved)/1000));save();last=Date.now();document.querySelector('dialog')?.close();shell();notify('Sauvegarde restaurée.');}catch{notify('Fichier invalide : choisissez une sauvegarde Arsenal au format JSON.');}};input.click();}
document.addEventListener('click',e=>{const b=e.target.closest('button,a');if(!b)return;if(b.dataset.country){selected=b.dataset.country;title();return;}if(b.dataset.view){view=b.dataset.view;shell();return;}const a=b.dataset.action;if(!a)return;if(a==='start'){if(state&&!confirm('Créer une nouvelle industrie et remplacer la sauvegarde actuelle ? Pensez à l’exporter avant.'))return;state=newGame(selected);view='harvest';last=Date.now();save();shell();return;}if(a==='continue'){last=Date.now();shell();if(offlineMessage){notify(offlineMessage);offlineMessage='';}return;}if(a==='home'){save();title();return;}if(a==='settings'){settings();return;}if(a==='export'){download();return;}if(a==='import'){importSave();return;}if(state&&act(state,a,b.dataset.id)){save();if(a==='harvest'){updateNumbers();return;}shell();if(a==='patent')notify('Brevet déposé. Les redevances sont maintenant automatiques.');}else notify('Conditions ou ressources insuffisantes.');});
setInterval(()=>{const now=Date.now();if(state){const before=state.tech.length;advance(state,(now-last)/1000);if(state.tech.length!==before){if(screen==='game')shell();notify('Recherche terminée : '+TECHS.find(t=>t.id===state.tech.at(-1)).name);}updateNumbers();}last=now;},250);
setInterval(save,5000);document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});window.addEventListener('pagehide',save);title();
</script></html>
