/* Mise en page de base : structures, composants et adaptations aux petits écrans. */
:root {
  --bg: #171c16;
  --panel: #252c21;
  --border: #4c513d;
  --cream: #e9e2cb;

  font-synthesis: none;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
}
button,
a,
input {

}
button,
a {

}
button {
  font: inherit;
  cursor: pointer;
  color: inherit;
}
button:disabled {

  opacity: 0.4;
}
a {
  color: inherit;
  text-decoration: none;
}
button:focus-visible,
a:focus-visible {

}
button {
  border: 0;
}
h1,
h2,
p {
  margin: 0;
}
h1,
h2,
.wordmark,
.country-name {

}
button:hover:not(:disabled),
a:hover {

}
.primary,
.secondary,
.upgrade,
.paper-button {
  display: inline-flex;
  justify-content: center;
  align-items: center;

  padding: 13px 18px;

  font-size: 12px;
  font-weight: bold;
  letter-spacing: 0.2px;
}
.primary,
.upgrade {
  background: var(--gold);
  color: #22271c;
  border: 1px solid #e8c781;
}
.secondary {
  background: transparent;
  border: 1px solid #68705a;
  color: var(--cream);
}
.full {
  width: 100%;
}
.eyebrow,
.serial,
.sidebar-label,
.blueprint-label {
  font-size: 10px;
  letter-spacing: 2px;
  font-weight: bold;
}
.title-screen {
  min-height: 100svh;
  position: relative;
  background:
    linear-gradient(90deg, #101a14f5 0%, #101a14e6 34%, #101a1470 76%, #101a1430),

  display: flex;
  flex-direction: column;
}
.title-screen:after {
  content: '';

  inset: 0;
  background: repeating-linear-gradient(0deg, transparent 0 3px, #00000008 4px);
}
.title-top,
.title-body,
.title-footer {

  z-index: 1;
}
.title-top {
  display: flex;
  align-items: center;
  gap: 22px;

}
.brand {

  color: var(--gold);
}
.brand-rule {

}
.edition {
  margin-left: auto;
  opacity: 0.6;
}
.title-body {

  max-width: 1250px;

}
.title-body .eyebrow {
  color: var(--gold);

  align-items: center;
}
.eyebrow i {

}

}

}
.intro {

}

}

}

}

}

  font-size: 13px;
  line-height: 1.7;
  color: #b7bfa6;
  margin: 20px 0;
}
.modal-actions {
  display: grid;
  gap: 12px;
}
dialog .small {
  font-size: 11px;
}
#toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translate(-50%, 20px);
  background: #ded4b5;
  color: #283220;
  border: 1px solid #f0e6c9;
  padding: 15px 24px;
  font-size: 12px;
  line-height: 1.6;
  z-index: 99;
  opacity: 0;
  pointer-events: none;
  transition: 0.25s;
  max-width: 90%;
  box-shadow: 0 5px 30px #0005;
}
#toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}
@media (min-width: 1600px) {
  .title-body {
    padding-top: 70px;
    padding-bottom: 65px;
  }
}
@media (max-width: 1150px) {
  .game-shell {
    grid-template-columns: 165px 1fr;
  }
  .sidebar {
    padding: 25px 8px;
  }
  .workspace {
    padding: 25px 20px;
  }
  .resource-grid,
  .tech-grid,
  .patent-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .sidebar-label {
    font-size: 7px;
  }
  .page-heading h1 {
    font-size: 28px;
  }
  .nation-label {
    padding-left: 20px;
  }
  .production-card {
    grid-template-columns: 30% 1fr;
  }
  .product-heading {
    display: block;
  }
  .status {
    display: block;
    margin-top: 8px;
  }
}
@media (max-width: 760px) {
  .title-top {
    padding: 18px 6vw;
    gap: 12px;
  }
  .title-top > span {
    font-size: 7px;
    letter-spacing: 1px;
  }
  .edition {
    display: none;
  }
  .title-body {
    padding: 35px 6vw;
  }
  .title-body h1 {
    font-size: 77px;
  }
  .intro {
    font-size: 12px;
  }
  .countries {
    gap: 8px;
  }
  .country {
    padding: 16px 12px;
    min-height: 195px;
  }
  .country-name {
    font-size: 21px;
  }
  .country-motto {
    font-size: 10px;
    line-height: 1.5;
  }
  .country strong {
    font-size: 10px;
    line-height: 1.5;
  }
  .check {
    right: 10px;
    top: 17px;
    font-size: 12px;
  }
  .title-actions {
    flex-direction: column;
  }
  .title-footer {
    flex-direction: column;
    font-size: 8px;
    line-height: 1.7;
  }
  .choose-label {
    font-size: 9px;
    letter-spacing: 1px;
  }
  .game-shell {
    display: block;
  }
  .topbar {
    height: 74px;
    padding: 0 15px;
    gap: 15px;
  }
  .wordmark {
    font-size: 24px;
    letter-spacing: 1px;
  }
  .wordmark small {
    font-size: 5px;
  }
  .nation-label {
    border: 0;
    padding: 0;
  }
  .nation-label > span:not(.flag) {
    display: none;
  }
  .wallet {
    gap: 6px;
  }
  .wallet small {
    font-size: 7px;
  }
  .wallet strong {
    font-size: 20px;
  }
  .wallet > span {
    font-size: 22px;
  }
  .sidebar {
    padding: 0;
    border: 0;
    position: sticky;
    top: 0;
    z-index: 5;
    background: #222b20;
    border-bottom: 1px solid #566043;
  }
  .sidebar-label,
  .sidebar-bottom {
    display: none;
  }
  .sidebar nav {
    display: flex;
    gap: 0;
    overflow-x: auto;
  }
  .sidebar nav button {
    flex: 1;
    flex-direction: column;
    gap: 4px;
    padding: 10px 8px;
    min-width: 70px;
    font-size: 10px;
    white-space: nowrap;
    border: 0;
  }
  .sidebar nav button.active {
    border: 0;
    box-shadow: inset 0 -2px var(--gold);
  }
  .sidebar nav button span {
    font-size: 18px;
  }
  .sidebar nav b {
    display: none;
  }
  .workspace {
    padding: 22px 14px;
  }
  .date-badge {
    display: none;
  }
  .page-heading h1 {
    font-size: 27px;
  }
  .mission {
    gap: 10px;
    padding: 12px;
    display: block;
  }
  .mission p {
    margin-top: 5px;
  }
  .section-intro {
    margin: 20px 0 15px;
    display: block;
  }
  .section-intro > span {
    display: block;
    margin-top: 8px;
  }
  .resource-grid,
  .tech-grid,
  .patent-grid {
    gap: 12px;
  }
  .resource-info {
    padding: 13px;
  }
  .resource-title h2 {
    font-size: 20px;
  }
  .resource-card header {
    padding: 12px 13px;
  }
  .serial {
    font-size: 7px;
  }
  .card-actions {
    flex-direction: column;
    gap: 7px;
  }
  .resource-info p {
    min-height: 34px;
  }
  .stock-row strong {
    font-size: 23px;
  }
  .rate {
    font-size: 9px;
  }
  .resource-title > span {
    font-size: 18px;
  }
  .level {
    font-size: 8px;
  }
  .next-card {
    padding: 18px;
  }
  .next-card h2 {
    font-size: 22px;
  }
  .next-card button {
    padding: 12px 8px;
    font-size: 9px;
  }
  .production-card {
    display: block;
  }
  .product-art {
    border: 0;
    border-bottom: 1px solid #505841;
    height: 180px;
  }
  .product-art svg {
    max-height: 115px;
  }
  .product-details {
    padding: 18px;
  }
  .production-stats {
    font-size: 9px;
  }
  .production-card .card-actions {
    flex-direction: row;
  }
  .patent-card {
    padding: 12px;
    border-width: 4px;
  }
  .patent-card h2 {
    font-size: 19px;
    min-height: 48px;
  }
  .paper-top {
    font-size: 6px;
    letter-spacing: 0;
  }
  .patent-benefit {
    display: block;
    line-height: 1.8;
  }
  .patent-benefit strong {
    display: block;
  }
  .stamp {
    font-size: 14px;
  }
  .patent-card > p {
    font-size: 10px;
  }
  .tech-card h2 {
    font-size: 20px;
  }
  .tech-card .upgrade {
    display: block;
    line-height: 1.8;
  }
  .tech-card .upgrade small {
    display: block;
  }
  .tech-card .resource-info p {
    min-height: 51px;
  }
  .tech-requirements {
    min-height: 48px;
  }
  .storage-panel {
    padding: 16px;
  }
  .inventory-row {
    flex-wrap: wrap;
    gap: 12px;
  }
  .inventory-row > span {
    min-width: 130px;
  }
  .inventory-row .meter {
    min-width: 60px;
  }
  .inventory-row small {
    min-width: 70px;
  }
  .game-footer {
    gap: 16px;
    line-height: 1.7;
    font-size: 7px;
  }
}
@media (prefers-reduced-motion: reduce) {
  * {
    transition: none !important;
  }
}

:root {
  --bg: #151810;
  --panel: #282d1e;
  --border: #82734a;
  --cream: #eee6cd;
  --muted: #b7b39a;
  --gold: #cda646;
  --pixel: ArsenalPixel, monospace;
  font-family: 'Courier New', monospace;
}
h1,
h2,
.wordmark,
.country-name,
.wallet strong,
.stock-row strong,
.date-badge strong {
  font-family: var(--pixel);
  font-weight: normal;
  letter-spacing: 0;
  text-transform: uppercase;
}
button,
.primary,
.secondary,
.upgrade,
.paper-button {
  font-family: var(--pixel);
  font-weight: normal;
  text-transform: uppercase;
  font-size: 13px;
  line-height: 1.4;
}
/* Real generated material atlas: upper left olive, upper right brass, lower left paper. */
.topbar,
.sidebar nav button,
.page-heading,
.resource-card,
.tech-card,
.management > h2,
.management-card,
.production-card,
.storage-panel,
dialog,
.country,
.wordmark,
.date-badge {
  background-color: #292e1f;
  background-image: linear-gradient(#11180d40, #11180d40), url('dist/assets/materials-atlas.png');
  background-size:
    100% 100%,
    200% 200%;
  background-position:
    0 0,
    0 0;
  border: 2px solid #181a11;
  border-top-color: #7e7851;
  border-left-color: #6c6846;
  border-radius: 3px;
  box-shadow:
    inset 0 0 0 1px #a1935b,
    inset 0 0 0 4px #191c14,
    0 2px 0 #080b07,
    0 0 0 1px #070a07;
  position: relative;
}
.resource-card:before,
.resource-card:after {
  display: none;
}
.topbar:after,
.page-heading:after,
.resource-card:after,
.tech-card:after,
.management > h2:after,
.management-card:after,
.production-card:after,
.country:after,
.storage-panel:after {
  display: block;
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(circle at 8px 8px, #ddc785 0 1px, #81713f 2px, #13180c 3px, transparent 4px),
    radial-gradient(
      circle at calc(100% - 8px) 8px,
      #ddc785 0 1px,
      #81713f 2px,
      #13180c 3px,
      transparent 4px
    ),
    radial-gradient(
      circle at 8px calc(100% - 8px),
      #ddc785 0 1px,
      #81713f 2px,
      #13180c 3px,
      transparent 4px
    ),
    radial-gradient(
      circle at calc(100% - 8px) calc(100% - 8px),
      #ddc785 0 1px,
      #81713f 2px,
      #13180c 3px,
      transparent 4px
    );
  z-index: 3;
  box-shadow: inset 0 0 12px #070b0455;
  border-radius: 2px;
  width: auto;
  height: auto;
  top: 0;
  left: 0;
}
.primary,
.upgrade,
.paper-button,
.sidebar nav button.active {
  background-color: #c59e3d;
  background-image: linear-gradient(#efba3d30, #bf8e1920), url('dist/assets/materials-atlas.png');
  background-size:
    100% 100%,
    200% 200%;
  background-position:
    0 0,
    100% 0;
  border: 2px solid #191e10;
  border-top-color: #ebd785;
  border-left-color: #cebd70;
  color: #171c0d;
  box-shadow:
    inset 0 0 0 1px #e5c473,
    inset 0 0 0 3px #5a4a2290,
    0 2px #090d06;
  text-shadow: 0 1px #e5cb7c80;
  border-radius: 2px;
  padding: 12px 16px;
  position: relative;
}
.primary:after,
.upgrade:after,
.paper-button:after {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(circle at 6px 50%, #fff1a1 0 1px, #6b5826 2px, #25250f 3px, transparent 4px),
    radial-gradient(
      circle at calc(100% - 6px) 50%,
      #fff1a1 0 1px,
      #6b5826 2px,
      #25250f 3px,
      transparent 4px
    );
}
.secondary {
  background: #333b26;
  border: 2px solid #a39866;
  border-right-color: #373d23;
  border-bottom-color: #343b21;
  box-shadow:
    inset 0 0 0 2px #131b10,
    0 2px #0b1108;
  border-radius: 2px;
  color: #e5dfc5;
  font-size: 12px;
}
button:hover:not(:disabled),
a:hover {
  filter: brightness(1.12);
}
button:active:not(:disabled) {
  transform: translateY(1px);
}
button:disabled {
  opacity: 0.52;
  filter: grayscale(0.8);
}
.game-shell {
  grid-template-columns: 196px 1fr;
  grid-template-rows: 90px 1fr;
  gap: 7px;
  padding: 7px;
  background:
    linear-gradient(#14160edb, #15180feb),
    url('dist/assets/materials-atlas.png') bottom left/1100px;
}
.topbar {
  padding: 8px 20px;
  gap: 26px;
  border: 2px solid #766845;
}
.wordmark {
  font-size: 37px;
  letter-spacing: 0;
  padding: 8px 18px;
  box-shadow:
    inset 0 0 0 2px #171c0d,
    0 0 0 1px #b3a171;
  color: #f2e9cd;
  text-shadow: 3px 3px #10160d;
}
.wordmark small {
  font:
    8px/1.3 'Courier New',
    monospace;
  letter-spacing: 2px;
  text-shadow: none;
}
.nation-label {
  font-family: var(--pixel);
  font-size: 17px;
  color: #eee2c6;
  border-left: 2px solid #81734b;
}
.nation-label small {
  font:
    11px 'Courier New',
    monospace;
  color: #cbc4a9;
}
.wallet {
  padding: 5px 23px;
  background: #10180ad4;
  border: 2px solid #84794b;
  box-shadow: inset 0 0 0 2px #070d05;
}
.wallet > span {
  font-family: monospace;
  font-size: 34px;
  text-shadow: 2px 2px #483b13;
  color: #f2c848;
}
.wallet small {
  font: 11px var(--pixel);
  letter-spacing: 0;
  color: #e6dfc7;
}
.wallet strong {
  font: 25px var(--pixel);
  color: #f0c64c;
}
.icon-btn {
  background: #333b25;
  border: 2px solid #a39a66;
  box-shadow: inset 0 0 0 2px #12190f;
  color: #e5dcc2;
}
.sidebar {
  padding: 0;
  border: 0;
  background: none;
  position: relative;
  overflow: hidden;
}
.sidebar-label {
  font: 10px var(--pixel);
  padding: 11px 6px;
  margin: 0;
  background: #262d1a;
  border: 1px solid #685e3b;
  text-align: center;
  color: #d3c7a7;
}
.sidebar nav {
  gap: 7px;
  margin: 7px 0;
}
.sidebar nav button {
  font: 14px var(--pixel);
  text-transform: uppercase;
  gap: 14px;
  padding: 17px 12px;
  min-height: 65px;

/* Research materials: compact costs with live availability. */
.research-costs {

}
.research-cost {

    10px/1.5 'Courier New',

.research-cost > span:not(.resource-icon) {

.research-cost strong {

}

/* Research board and inspectable square nodes. */
.research-tree {
  position: relative;
  isolation: isolate;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  grid-template-rows: repeat(3, 150px);
  padding: 0;
  border: 2px solid #8b7a4d;
  background:
    linear-gradient(#8192650c 1px, transparent 1px),
    linear-gradient(90deg, #8192650c 1px, transparent 1px), #141e11;
  background-size: 22px 22px;
  box-shadow: inset 0 0 0 4px #0a1008;
  margin: 16px 0 12px;
}
.research-links {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: -1;
  overflow: visible;
}
.research-links path {
  fill: none;
  stroke: #5f6145;
  stroke-width: 2;
  vector-effect: non-scaling-stroke;
  stroke-dasharray: 5 5;
}
.research-links path.fulfilled {
  stroke: #c6ac59;
  stroke-dasharray: none;
}
.research-node {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-width: 0;
  padding: 10px 3px;
  gap: 5px;
}
.research-square {
  position: relative;
  flex: none;
  width: 64px;
  height: 64px;
  padding: 10px;
  border: 2px solid #a28b52;
  background: #293520;
  box-shadow:
    inset 0 0 0 3px #10180c,
    3px 3px #070d06;
  color: #dfc773;
  cursor: pointer;
}
.research-square svg {
  width: 100%;
  height: 100%;
  filter: drop-shadow(2px 2px #080e06);
}
.research-square:hover,
.research-square:focus-visible {
  outline: 2px solid #f1d882;
  outline-offset: 3px;
}
.research-node.locked .research-square {
  color: #929781;
  border-color: #62664f;
  background: #1b2417;
}
.research-node.completed .research-square {
  color: #daebaf;
  border-color: #acbf80;
  background: #33462a;
}
.research-node.running .research-square {
  color: #ffde77;
  border-color: #f1c557;
  background: #4b4323;
}
.research-node-mark {
  position: absolute;
  right: -5px;
  bottom: -5px;
  font: 13px/18px monospace;
  background: #111b0d;
  border: 1px solid currentColor;
  width: 20px;
  height: 20px;
  text-align: center;
}
.research-node-name {
  font: 10px/1.5 var(--pixel);
  text-align: center;
  max-width: 96%;
  background: #141e11;
  color: #e3d9b7;
  padding: 2px 3px;
}
.research-node-state {
  font:
    8px/1.3 'Courier New',
    monospace;
  color: #b6b89a;
  background: #141e11;
  padding: 1px 3px;
}
.research-detail {
  display: none;
  position: absolute;
  top: calc(100% - 12px);
  left: 50%;
  transform: translateX(-50%);
  width: 330px;
  max-width: calc(300% - 12px);
  border: 2px solid #b49b58;
  background: #1d2919;
  box-shadow:
    0 8px 24px #000b,
    inset 0 0 0 3px #0b1308;
  padding: 16px 8px 8px;
  z-index: 30;
  color: #e3dbbb;
}
.research-node[style*='grid-column:1'] .research-detail {
  left: 6px;
  transform: none;
}
.research-node[style*='grid-column:3'] .research-detail {
  left: auto;
  right: 6px;
  transform: none;
}
.research-node[style*='grid-row:3'] .research-detail {
  top: auto;
  bottom: calc(100% - 12px);
}
.research-node[data-preview='true'],
.research-node:focus-within,
.research-node[data-pinned='true'] {
  z-index: 20;
}
.research-node[data-preview='true'] .research-detail,
.research-node:has(.research-square:focus-visible) .research-detail,
.research-detail:focus-within,
.research-node[data-pinned='true'] .research-detail {
  display: block;
}
.research-detail .resource-info {
  background: none;
  padding: 8px;
}
.research-detail h2 {
  font: 16px/1.5 var(--pixel);
  margin: 6px 20px 12px 0;
}
.research-detail-close {
  position: absolute;
  right: 5px;
  top: 4px;
  padding: 1px 6px;
  font: 20px monospace;
  color: #ead395;
  background: #25331d;
  border: 1px solid #7b7047;
}
.research-detail .tech-requirements {
  font:
    11px/1.5 'Courier New',
    monospace;
}
.research-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  font:
    10px/1.6 'Courier New',
    monospace;

}
@media (max-width: 480px) {
  .research-square {
    width: 54px;

    font-size: 8px;

/* Icônes compactes : mêmes proportions sur ordinateur, tablette et téléphone.
   Les aplats gardent le style pixel art ; le rééchantillonnage normal évite
   de perdre des morceaux de contour lors de la réduction des grandes planches. */
.compact-icon,
.worker-icon.compact-icon,
.wage-icon.compact-icon,
.factory-icon.compact-icon,
.resource-icon.compact-icon,
.sidebar nav button .menu-icon.compact-icon,
.wallet > .workforce-icon.compact-icon,
.factory-pool > .factory-icon.compact-icon {
  --icon-size: 32px;
  position: relative;
  display: inline-block;
  width: var(--icon-size);
  height: var(--icon-size);
  min-width: var(--icon-size);
  flex: 0 0 var(--icon-size);
  aspect-ratio: 1;
  overflow: hidden;
  vertical-align: middle;
  align-self: center;
  padding: 0;
  background: none;
  filter: none;
  mix-blend-mode: normal;
  image-rendering: auto;
}
.compact-icon > img,
.resource-icon.compact-icon > img {
  position: absolute;
  display: block;
  max-width: none;
  max-height: none;
  object-fit: fill;
  image-rendering: auto;
  pointer-events: none;
  user-select: none;
  filter: none;
}
.topbar .resource-stock .resource-icon.compact-icon,
.production-card .recipe .resource-icon.compact-icon,
.research-cost .resource-icon.compact-icon,
.wage-icon.compact-icon {
  --icon-size: 24px;
  width: var(--icon-size);
  height: var(--icon-size);
  min-width: var(--icon-size);
  flex: 0 0 var(--icon-size);
}
.worker-icon.compact-icon,
.wallet > .workforce-icon.compact-icon {
  --icon-size: 28px;
}
@media (max-width: 760px) {
  .sidebar nav button .menu-icon.compact-icon {
    --icon-size: 28px;
  }
  .resource-card header h2 .resource-icon.compact-icon {

/* Papier de dépêche : la feuille avance par petits à-coups sous le rouleau. */
#toast {
  left: auto;
  right: 22px;
  bottom: 22px;
  width: 360px;
  max-width: calc(100vw - 32px);
  padding: 18px 20px 12px;
  border: 1px solid #817044;
  border-top: 7px solid #3e3e2a;
  background: repeating-linear-gradient(0deg, #00000004 0 1px, transparent 1px 4px), #ded0a1;
  color: #302b1c;
  box-shadow:
    0 8px 22px #0009,
    inset 0 0 22px #9c7b3833;
  font:
    13px/1.55 'Courier New',
    monospace;
  transform: translateY(16px);
  visibility: hidden;
  z-index: 200;
}
#toast.show {
  transform: translateY(0);
  visibility: visible;
  pointer-events: auto;
  animation: telegram-print 0.8s steps(12, end);
}
.telegram-heading {
  display: flex;
  flex-direction: column;
  gap: 3px;
  border-bottom: 2px solid #766440;
  padding-bottom: 8px;
}
.telegram-heading strong {
  font-size: 20px;
  letter-spacing: 3px;
}
.telegram-heading span {
  font-size: 9px;
  letter-spacing: 1px;
}
#telegram-message {
  margin: 16px 0;
  overflow-wrap: anywhere;
}
.telegram-footer {
  display: flex;
  align-items: center;
  gap: 10px;
  border-top: 1px dashed #8e7c53;
  padding-top: 8px;
}
.telegram-footer > span {
  flex: 1;
  font-size: 8px;
  letter-spacing: 1px;
}
.telegram-footer button {
  color: #302b1c;
  background: transparent;
  border: 1px solid #8e7c53;
  padding: 4px 6px;
  font:
    11px 'Courier New',
    monospace;
  cursor: pointer;
}
.telegram-footer button:focus-visible {
  outline: 2px solid #302b1c;
  outline-offset: 2px;
}
@keyframes telegram-print {
  from {
    clip-path: inset(0 0 100% 0);
    transform: translateY(-12px);
  }
  to {
    clip-path: inset(0);
    transform: translateY(0);
  }
}
@media (prefers-reduced-motion: reduce) {
  #toast.show {
    animation: none;
  }
  #toast {
    transition: none;
  }
}
@media (max-width: 600px) {
  #toast {
    right: 16px;
    bottom: 16px;
  }
}

// Liste les conditions encore manquantes pour acheter le brevet.
function patentRequirements(state, product) {
  const missing = [];
  if (!state.tech.includes(product.unlock))
    missing.push('Recherche : ' + TECHS.find((t) => t.id === product.unlock).name);
  if (
    !state.patents.includes(product.id) &&
    product.tier &&
    state.lines.find((line) => line.id === PRODUCTS[product.tier - 1].id).made < 1
  )
    missing.push('Fabriquer : ' + PRODUCTS[product.tier - 1].name);
  return missing;
}
// Ajoute les conditions de licence et d’exploitation nécessaires à la fabrication.
function productionRequirements(state, product) {
  const missing = patentRequirements(state, product);
  if (!state.patents.includes(product.id)) missing.push('Acheter le brevet : ' + product.name);
  const sites = Object.keys(product.recipe)
    .filter((id) => !state.levels[id])
    .map((id) => RESOURCES.find((resource) => resource.id === id).name);
  if (sites.length) missing.push('Ouvrir : ' + sites.join(', '));
  return missing;
}

const MAX_FACTORIES = 250;
const factoryCost = (state) => Math.ceil(1000 * 1.3 ** Math.floor(state.factories / 5));
// Un lot commencé garde ses usines réservées jusqu’à son achèvement.
const freeFactories = (state) =>
  state.factories - state.lines.reduce((n, line) => n + Math.max(line.factories, line.batch), 0);
// Limiter le lot aux usines, aux matières disponibles et à la place en stock.
// La réduction porte sur les matières consommées, jamais sur la valeur de vente.
const productionRecipe = (state, product) =>
  Object.fromEntries(
    Object.entries(product.recipe).map(([id, amount]) => [
      id,
      amount * (state.tech.includes('tooling') ? 0.9 : 1),
    ]),
  );
const productionBatch = (state, product, line) =>
  Math.max(
    0,
    Math.min(
      line.factories,
      9999 - line.stock,
      ...Object.entries(productionRecipe(state, product)).map(([id, n]) =>
        Math.floor((state.resources[id] + 1e-9) / n),
      ),
    ),
  );
const capacity = (state, resource = RESOURCES[0]) =>
  Math.ceil(5000 * RESOURCE_CAPACITY_GROWTH ** resource.tier) *
  (state.tech.includes('logistics') ? 2 : 1);
const HIRE_COST = 25,
  WAGE = 2,
  PAY_PERIOD = 60;
// Arrondir le prix final seulement, pour conserver la progression prévue.
const hireCost = (state, resource) =>
  Math.ceil(HIRE_COST * 1.5 ** resource.tier * 1.3 ** state.workers[resource.id].length);
// Le salaire dépend du site, jamais du nombre d’ouvriers déjà engagés.
const workerWage = (resource) => Math.ceil(WAGE * 1.5 ** resource.tier);
const MARKET_PRICES = Object.fromEntries(
  RESOURCES.map((resource) => [resource.id, Math.ceil(1.5 ** resource.tier)]),
);
const available = (state, resource) =>
  state.levels[resource.id] > 0 || !resource.previous || state.levels[resource.previous] > 0;
const unlocked = (state, resource) =>
  state.levels[resource.id] > 0 && available(state, resource);
const activeWorkers = (state, resource) =>
  state.workers[resource.id].filter((t) => t > 1e-8).length;
const rate = (state, resource) =>
  unlocked(state, resource)
    ? resource.rate *
      state.levels[resource.id] *
      activeWorkers(state, resource) *
      (state.country === 'su' ? 1.15 : 1) *
      (state.tech.includes('steam') ? 1.2 : 1) *
      (state.tech.includes('logistics') ? 1.25 : 1)
    : 0;
const upgradeCost = (state, resource) =>
  Math.ceil(resource.cost * 1.65 ** state.levels[resource.id]);
const researchTime = (state, t) => t.time / (state.country === 'fr' ? 1.15 : 1);
const productTime = (state, product) =>
  product.time /
  (state.country === 'us' ? 1.15 : 1) /
  (state.tech.includes('assembly') ? 1.25 : 1) /
  (state.tech.includes('electricity') ? 1.15 : 1);
const salePrice = (state, product) =>
  Math.ceil(
    product.value *
      (state.country === 'de' ? 1.15 : 1) *
      (state.tech.includes('series') ? 1.25 : 1),
  );
const affordable = (state, cost) =>
  Object.entries(cost).every(([k, v]) => state.resources[k] >= v);
// Fait avancer salaires, récolte, recherches et production, au maximum sur huit heures.
function advance(state, seconds) {
  let left = Math.max(0, Math.min(28800, Number(seconds) || 0));
  while (left > 1e-8) {
    // Le salaire finance une minute ; sans or, l’ouvrier attend le prochain paiement.
    for (const resource of RESOURCES)
      for (let i = 0; i < state.workers[resource.id].length; i++)
        if (state.workers[resource.id][i] <= 1e-8 && state.credits >= workerWage(resource)) {
          state.credits -= workerWage(resource);
          state.workers[resource.id][i] = PAY_PERIOD;
        }
    const remaining = Object.values(state.workers)
      .flat()
      .filter((t) => t > 1e-8);
    const dt = Math.min(1, left, ...remaining);
    left -= dt;
    state.elapsed += dt;
    for (const resource of RESOURCES)
      state.resources[resource.id] = Math.min(
        capacity(state, resource),
        state.resources[resource.id] + rate(state, resource) * dt,
      );
    for (const resource of RESOURCES)
      state.workers[resource.id] = state.workers[resource.id].map((t) => Math.max(0, t - dt));
    if (state.research) {
      state.research.remaining -= dt;
      if (state.research.remaining <= 0) {
        state.tech.push(state.research.id);
        state.research = null;
      }
    }
    for (const line of state.lines) {
      const product = PRODUCTS.find((x) => x.id === line.id);
      if (!line.enabled) continue;
      // Un pas de temps peut terminer un lot et commencer le suivant.
      let budget = dt;
      while (budget > 1e-8) {
        if (line.remaining <= 1e-8) {
          const batch = productionBatch(state, product, line);
          if (!batch || !productionUnlocked(state, product)) break;
          for (const [id, n] of Object.entries(productionRecipe(state, product)))
            state.resources[id] = Math.max(0, state.resources[id] - n * batch);
          line.batch = batch;
          line.licensed = true;
          line.remaining = productTime(state, product);
        }
        const used = Math.min(budget, line.remaining);
        line.remaining -= used;
        budget -= used;
        if (line.remaining <= 1e-8) {
          line.remaining = 0;
          line.stock += line.batch;
          line.made += line.batch;
          line.batch = 0;
          if (!line.factories) {
            line.enabled = false;
            break;
          }
        }
      }
    }
  }
  return state;
}
// Valide une action avant de dépenser ses coûts. Renvoie false si elle est impossible.
function act(state, type, id, requestedAmount) {
  if (type === 'buy-factory') {
    if (state.factories >= MAX_FACTORIES || state.credits < factoryCost(state)) return false;
    state.credits -= factoryCost(state);
    state.factories++;
    return true;
  }
  if (type === 'assign-factory' || type === 'release-factory') {
    const line = state.lines.find((line) => line.id === id);
    if (!line) return false;
    if (type === 'assign-factory') {
      if ((freeFactories(state) < 1 && line.factories >= line.batch) || !state.patents.includes(id))
        return false;
      line.factories++;
    } else {
      if (!line.factories) return false;
      line.factories--;
      if (!line.factories && !line.remaining) line.enabled = false;
    }
    return true;
  }
  if (type === 'harvest') {
    const resource = RESOURCES.find((resource) => resource.id === id);
    if (!resource || !unlocked(state, resource) || state.resources[id] >= capacity(state, resource))
      return false;
    // Un niveau de site apporte une unité par clic, dans la limite du stock.
    state.resources[id] = Math.min(
      capacity(state, resource),
      state.resources[id] + state.levels[id],
    );
    return true;
  }
  if (type === 'upgrade') {
    const resource = RESOURCES.find((resource) => resource.id === id);
    if (
      !resource ||
      !available(state, resource) ||
      state.levels[id] >= 100 ||
      state.credits < upgradeCost(state, resource)
    )
      return false;
    state.credits -= upgradeCost(state, resource);
    state.levels[id]++;
    return true;
  }
  if (type === 'hire') {
    const resource = RESOURCES.find((resource) => resource.id === id);
    if (
      !resource ||
      !unlocked(state, resource) ||
      state.workers[id].length >= 100 ||
      state.credits < hireCost(state, resource) + workerWage(resource)
    )
      return false;
    state.credits -= hireCost(state, resource) + workerWage(resource);
    state.workers[id].push(PAY_PERIOD);
    return true;
  }
  if (type === 'dismiss') {
    const resource = RESOURCES.find((resource) => resource.id === id);
    if (!resource || !state.workers[id].length) return false;
    state.workers[id].pop();
    return true;
  }
  if (['sell-resource', 'sell-ten', 'sell-all', 'sell-quantity'].includes(type)) {
    const resource = RESOURCES.find((resource) => resource.id === id);
    if (!resource) return false;
    const amount =
      type === 'sell-quantity'
        ? requestedAmount
        : type === 'sell-all'
          ? Math.floor(state.resources[id])
          : type === 'sell-ten'
            ? 10
            : 1;
    if (!Number.isSafeInteger(amount) || amount <= 0 || state.resources[id] < amount) return false;
    state.resources[id] -= amount;
    state.credits += amount * MARKET_PRICES[id];
    return true;
  }
  if (type === 'research') {
    const t = TECHS.find((t) => t.id === id);
    if (
      !t ||
      state.research ||
      state.tech.includes(id) ||
      !t.requires.every((k) => state.tech.includes(k)) ||
      !affordable(state, t.cost)
    )
      return false;
    for (const [resource, amount] of Object.entries(t.cost)) state.resources[resource] -= amount;
    state.research = { id, remaining: researchTime(state, t) };
    return true;
  }
  if (type === 'patent') {
    const product = PATENTS.find((product) => product.id === id);
    if (
      !product ||
      patentRequirements(state, product).length ||
      state.patents.includes(id) ||
      state.credits < product.cost
    )
      return false;
    state.credits -= product.cost;
    state.patents.push(id);
    state.lines.find((line) => line.id === id).licensed = true;
    return true;
  }
  if (type === 'toggle') {
    const line = state.lines.find((line) => line.id === id),
      product = PRODUCTS.find((product) => product.id === id);
    if (
      !line ||
      (!line.enabled &&
        ((!line.factories && !line.batch) ||
          (line.remaining <= 0 && !productionUnlocked(state, product))))
    )
      return false;
    line.enabled = !line.enabled;
    return true;
  }
  if (type === 'sell') {
    const line = state.lines.find((line) => line.id === id),
      product = PRODUCTS.find((product) => product.id === id);
    if (!line || !line.stock) return false;
    state.credits += line.stock * salePrice(state, product);
    state.totalSold += line.stock;
    line.stock = 0;
    return true;
  }

function goal() {
  if (!Object.values(state.workers).some((crew) => crew.length))
    return 'Engagez votre premier ouvrier.';
  const next = RESOURCES.find((resource) => !state.levels[resource.id]);
  if (next) return `Prochaine exploitation : ${next.name} · ${fmt(next.cost)} or.`;
  if (!state.lines.some((line) => line.enabled || line.made))
    return 'Préparez votre première ligne d’uniformes.';
  if (!state.totalSold) return 'Première livraison : vendez votre premier lot dans Production.';
  if (state.research)
    return 'Vos ingénieurs travaillent. Rassemblez les ressources nécessaires à la prochaine avancée.';
  if (!state.tech.length) return 'Préparez votre atelier de confection.';
  if (!state.patents.length) return 'Achetez votre première licence de production dans Brevets.';
  return 'Développez vos ateliers, approvisionnez la recherche et débloquez les blindés.';
}

// Affiche les ventes de matières premières.
// La sélection reste stable quand les stocks montent, mais ne dépasse jamais le stock vendable.
const marketQuantities = {};
function updateMarketQuantity(id) {
  if (!state || !RESOURCES.some((resource) => resource.id === id)) return;
  const stock = Math.floor(state.resources[id]);
  const selected = Math.max(0, Math.min(stock, marketQuantities[id] ?? Math.min(1, stock)));
  marketQuantities[id] = selected;
  const field = document.getElementById('market-quantity-' + id);
  const slider = document.getElementById('market-slider-' + id);
  for (const input of [field, slider]) {
    if (!input) continue;
    input.max = String(stock);
    input.disabled = stock === 0;
    // Laisser le joueur vider le champ pendant sa saisie.
    if (!(input === field && document.activeElement === field && field.value === ''))
      input.value = String(selected);
  }
  text('market-owned-' + id, fmt(stock));
  text(
    'sell-quantity-' + id,
    `Vendre ${fmt(selected)} · ${money(selected * MARKET_PRICES[id])} or`,
  );
  disable('sell-quantity-' + id, selected <= 0);
  disable('market-more-' + id, selected >= stock);
  disable('market-less-' + id, selected <= 0);
}
function editMarketQuantity(event) {
  const id = event.target.dataset?.marketQuantity;
  if (!id || !state || !RESOURCES.some((resource) => resource.id === id)) return;
  const value = Number(event.target.value);
  marketQuantities[id] = Number.isFinite(value) ? Math.max(0, Math.floor(value)) : 0;
  updateMarketQuantity(id);
  if (event.type === 'change') event.target.value = String(marketQuantities[id]);
}

// Le premier prérequis dessine la branche principale. Les autres restent des renvois.
// Chaque sous-arbre possède ses couloirs pour éviter tout croisement.
function researchLayout() {
  const root = 'research-root';
  const techs = TECHS;
  const parents = Object.fromEntries(techs.map((tech) => [tech.id, tech.requires[0] || root]));
  const children = (id) => techs.filter((tech) => parents[tech.id] === id);
  const leaves = (id) =>
    Math.max(
      1,
      children(id).reduce((total, child) => total + leaves(child.id), 0),
    );
  const lanes = leaves(root);
  const positions = {};
  let cursor = 0;
  function place(id, depth) {
    const start = cursor,
      descendants = children(id);
    if (descendants.length) descendants.forEach((child) => place(child.id, depth + 1));
    else cursor++;
    positions[id] = { x: ((start + cursor) / 2 / lanes) * 100, depth };
  }
  place(root, 0);
  return {
    root,
    techs,
    parents,
    positions,
    lanes,
    width: lanes * 160,
    height: (Math.max(...Object.values(positions).map((position) => position.depth)) + 1) * 220,
  };
}

          preserveAspectRatio="none"
          aria-hidden="true"
        >
          ${layout.techs
            .flatMap((tech) =>
              [layout.parents[tech.id]].map((id) => {
                const from = layout.positions[id],
                  to = layout.positions[tech.id];
                return /* HTML */ `<path
                  class="${id === layout.root || state.tech.includes(id) ? 'fulfilled' : ''}"
                  d="M${from.x * 3.2} ${from.depth * 220 + 74} V${from.depth * 220 + 202} H${to.x *
                  3.2} V${to.depth * 220 + 18}"
                />`;
              }),
            )
            .join('')}
        </svg>
        ${layout.techs
          .map((t) => {
            const i = TECHS.indexOf(t);

              ready = t.requires.every((k) => state.tech.includes(k)),
              { x, depth } = layout.positions[t.id],
              status = done ? 'VALIDÉ' : running ? 'EN COURS' : ready ? 'ACCESSIBLE' : 'VERROUILLÉ';
            return /* HTML */ `<div
              class="research-node ${done
                ? 'completed'
                : running
                  ? 'running'
                  : ready
                    ? 'available'
                    : 'locked'}"
              style="left:${x}%;top:${depth * 220 + 18}px;--lanes:${layout.lanes}"
              data-pinned="${pinnedResearch === t.id}"
            >
              <button
                class="research-square"
                data-research-node="${t.id}"
                aria-label="${t.name} · ${status}"
                aria-expanded="${pinnedResearch === t.id}"
                aria-controls="research-detail-${t.id}"
              >
                ${researchIcon(t.id)}<span class="research-node-mark" aria-hidden="true"
                  >${done ? '✓' : running ? '◷' : ready ? '+' : '×'}</span
                ></button
              ><span class="research-node-name">${t.name}</span
              ><span class="research-node-state">${status}</span>
              ${t.requires
                .filter((id) => id !== layout.parents[t.id])
                .map((id) => {
                  const prerequisite = TECHS.find((parent) => parent.id === id);
                  return /* HTML */ `<button
                    class="research-prerequisite ${state.tech.includes(id) ? 'met' : ''}"
                    data-research-jump="${id}"
                    title="Prérequis supplémentaire : ${prerequisite.name}"
                  >
                    ${state.tech.includes(id) ? '✓' : '↗'} ${prerequisite.name}
                  </button>`;
                })
                .join('')}
              <section class="research-detail" id="research-detail-${t.id}" aria-label="${t.name}">
                <button
                  class="research-detail-close"
                  data-research-close="${t.id}"
                  aria-label="Fermer le dossier"
                >
                  ×
                </button>
                <div class="resource-info">
                  <span class="serial"
                    >DOSSIER R–0${i + 1} /
                    ${done ? 'VALIDÉ' : running ? 'EN COURS' : 'RECHERCHE'}</span
                  >
                  <h2>${t.name}</h2>
                  <p><strong>Effets :</strong> ${t.desc}</p>
                  <p>
                    <strong>Brevets :</strong> ${PRODUCTS.filter(
                      (product) => product.unlock === t.id,
                    )
                      .map((product) => product.name)
                      .join(', ') || 'Amélioration industrielle'}.
                  </p>
                  <div class="tech-requirements">
                    <strong>Prérequis :</strong> ${t.requires.length
                      ? t.requires.map((k) => TECHS.find((x) => x.id === k).name).join(', ')
                      : 'Aucun'}
                  </div>
                  ${!done && !running
                    ? /* HTML */ `<div class="research-costs" aria-label="Ressources nécessaires">
                        <strong class="research-cost-heading">Ressources nécessaires :</strong
                        >${Object.entries(t.cost)
                          .map(
                            ([id, n]) =>
                              /* HTML */ `<div class="research-cost">
                                ${resourceIcon(id)}<span
                                  >${RESOURCES.find((resource) => resource.id === id).name}</span
                                ><strong id="research-cost-${t.id}-${id}"></strong>
                              </div>`,
                          )
                          .join('')}
                      </div>`
                    : ''}${done
                    ? '<div class="done-label">✓ Technologie maîtrisée</div>'
                    : running
                      ? /* HTML */ `<div class="meter"><i id="research-bar"></i></div>
                          <div class="research-time" id="research-time"></div>`
                      : /* HTML */ `<button
                          class="upgrade full"
                          data-action="research"
                          data-id="${t.id}"
                          id="research-${t.id}"
                          ${!ready ? 'disabled' : ''}
                        >
                          Lancer la recherche <small>${clock(researchTime(state, t))}</small>
                        </button>`}
                </div>
              </section>
            </div>`;
          })
          .join('')}
      </div>
    </div>
    <div class="research-legend">
      <span>□ Verrouillé</span><span>＋ Accessible</span><span>◷ En cours</span
      ><span>✓ Validé</span>
    </div>`;
}

function text(id, value) {
  const el = document.getElementById(id);
  if (el) el.textContent = value;
}
function width(id, v) {
  const el = document.getElementById(id);
  if (el) el.style.width = Math.min(100, Math.max(0, v)) + '%';
}
function disable(id, value) {
  const el = document.getElementById(id);
  if (el) el.disabled = value;
}
// Rafraîchit les valeurs et les boutons sans reconstruire tout l’écran.
function updateNumbers() {
  if (screen !== 'game') return;
  text('credits', money(state.credits) + ' or');
  text('current-goal', goal());
  text(
    'total-wages',
    fmt(
      RESOURCES.reduce(
        (n, resource) => n + state.workers[resource.id].length * workerWage(resource),
        0,
      ),
    ) + ' or',
  );
  text(
    'total-rate',
    '+ ' + dec(RESOURCES.reduce((sum, resource) => sum + rate(state, resource) * 60, 0)),
  );
  text('total-income', state.patents.length + ' / ' + PRODUCTS.length);
  text('total-sold', fmt(state.totalSold));
  text(
    'project-status',
    state.research
      ? TECHS.find((t) => t.id === state.research.id).name + ' · ' + clock(state.research.remaining)
      : 'Ingénieurs disponibles',
  );
  width(
    'management-research',
    state.research
      ? 100 *
          (1 -
            state.research.remaining /
              researchTime(
                state,
                TECHS.find((t) => t.id === state.research.id),
              ))
      : 0,
  );
  text(
    'save-status',
    saved ? '● Sauvegarde automatique' : '⚠ Sauvegarde indisponible · exportez votre partie',
  );
  updateResourceNumbers();
  updateProductionNumbers();
  for (const t of TECHS) {
    disable(
      'research-' + t.id,
      !!state.research ||
        state.tech.includes(t.id) ||
        !affordable(state, t.cost) ||
        !t.requires.every((k) => state.tech.includes(k)),
    );
    for (const [id, n] of Object.entries(t.cost)) {
      text('research-cost-' + t.id + '-' + id, fmt(state.resources[id]) + ' / ' + fmt(n));
      const el = document.getElementById('research-cost-' + t.id + '-' + id);
      if (el) el.setAttribute('data-missing', String(state.resources[id] < n));
    }
  }
  if (state.research) {
    const t = TECHS.find((t) => t.id === state.research.id);
    width('research-bar', 100 * (1 - state.research.remaining / researchTime(state, t)));
    text('research-time', `${clock(state.research.remaining)} · Recherche en cours`);
  }
  for (const product of PATENTS)
    disable(
      'patent-' + product.id,
      state.patents.includes(product.id) ||
        patentRequirements(state, product).length > 0 ||
        state.credits < product.cost,
    );
}
// Stocks, prix du marché et disponibilité des ouvriers.
function updateResourceNumbers() {
  for (const resource of RESOURCES) {
    const maxStock = capacity(state, resource);
    text('capacity-' + resource.id, fmt(maxStock));
    text('header-capacity-' + resource.id, '/ ' + compact(maxStock));
    text('stock-' + resource.id, fmt(state.resources[resource.id]));
    const stockEl = document.getElementById('stock-' + resource.id);
    if (stockEl) stockEl.title = `Capacité : ${fmt(capacity(state, resource))}`;
    text('header-stock-' + resource.id, compact(state.resources[resource.id]));
    const headerStock = document.getElementById('header-stock-' + resource.id);
    if (headerStock) {
      headerStock.setAttribute(
        'aria-label',
        `${fmt(state.resources[resource.id])} sur ${fmt(maxStock)}`,
      );
      headerStock.parentElement.title = `${resource.name} : ${fmt(state.resources[resource.id])} / ${fmt(maxStock)}`;
    }
    text('rate-' + resource.id, `+ ${dec(rate(state, resource) * 60)} / min`);
    text(
      'level-' + resource.id,
      state.levels[resource.id] ? `NIV. ${state.levels[resource.id]}` : 'À OUVRIR',
    );
    text(
      'upgrade-' + resource.id,
      `${state.levels[resource.id] ? 'Améliorer' : 'Ouvrir'} · ${fmt(upgradeCost(state, resource))} ◉`,
    );
    disable(
      'upgrade-' + resource.id,
      !available(state, resource) ||
        state.levels[resource.id] >= 100 ||
        state.credits < upgradeCost(state, resource),
    );
    width('bar-' + resource.id, (state.resources[resource.id] / capacity(state, resource)) * 100);
    const crew = state.workers[resource.id],
      active = activeWorkers(state, resource),
      quantity = Math.floor(state.resources[resource.id]);
    text('workers-' + resource.id, crew.length);
    text(
      'hire-price-' + resource.id,
      money(hireCost(state, resource) + workerWage(resource)) + ' or',
    );
    text('payroll-' + resource.id, crew.length * workerWage(resource));
    const crewStatus = !crew.length
      ? 'Aucun ouvrier'
      : active < crew.length
        ? `${active} au travail, ${crew.length - active} en pause : salaire manquant`
        : `${active} au travail · prochain salaire dans ${Math.ceil(Math.min(...crew))} s`;
    const statusEl = document.getElementById('worker-status-' + resource.id);
    if (statusEl) {
      statusEl.textContent = active < crew.length ? 'Ⅱ' : '●';
      statusEl.dataset.state = !crew.length ? 'empty' : active < crew.length ? 'paused' : 'active';
      statusEl.title = crewStatus;
      statusEl.setAttribute('aria-label', crewStatus);
    }
    const crewEl = document.getElementById('crew-' + resource.id);
    if (crewEl) {
      crewEl.title = crewStatus;
      crewEl.setAttribute('aria-label', `${crew.length} ouvrier(s) · ${crewStatus}`);
    }
    const wagesEl = document.getElementById('wages-' + resource.id);
    if (wagesEl)
      wagesEl.setAttribute(
        'aria-label',
        `Salaires : ${crew.length * workerWage(resource)} or par minute`,
      );
    disable('harvest-' + resource.id, state.resources[resource.id] >= capacity(state, resource));
    disable(
      'hire-' + resource.id,
      state.credits < hireCost(state, resource) + workerWage(resource) || crew.length >= 100,
    );
    disable('dismiss-' + resource.id, !crew.length);
    if (view === 'market') updateMarketQuantity(resource.id);
    disable('sell-all-' + resource.id, quantity < 1);
    text(
      'sell-all-' + resource.id,
      `Tout vendre (${fmt(quantity)}) · ${money(quantity * MARKET_PRICES[resource.id])} or`,
    );
  }
}

// Usines disponibles, lots en cours et commandes de chaque ligne.
function updateProductionNumbers() {
  text('factory-summary', state.factories + ' usines · ' + freeFactories(state) + ' disponibles');
  text(
    'buy-factory',
    state.factories >= MAX_FACTORIES
      ? 'Limite atteinte'
      : 'Acheter · ' + money(factoryCost(state)) + ' or',
  );
  disable('buy-factory', state.factories >= MAX_FACTORIES || state.credits < factoryCost(state));
  for (const product of PRODUCTS) {
    const line = state.lines.find((line) => line.id === product.id);
    text('factories-' + product.id, line.factories);
    text(
      'batch-' + product.id,
      line.remaining > 0
        ? line.batch + ' unités en cours'
        : productionBatch(state, product, line) + ' unités disponibles / cycle',
    );
    disable(
      'assign-factory-' + product.id,
      (freeFactories(state) < 1 && line.factories >= line.batch) ||
        !state.patents.includes(product.id),
    );
    disable('release-factory-' + product.id, !line.factories);
    text(
      'status-' + product.id,
      !line.factories && !line.batch
        ? 'AUCUNE USINE'
        : line.enabled
          ? line.remaining > 0
            ? 'EN PRODUCTION'
            : line.stock >= 9999
              ? 'STOCK PLEIN'
              : !productionUnlocked(state, product)
                ? 'PRÉREQUIS MANQUANTS'
                : affordable(state, productionRecipe(state, product))
                  ? 'DÉMARRAGE'
                  : 'MATIÈRES MANQUANTES'
          : productionUnlocked(state, product) || line.remaining > 0
            ? 'À L’ARRÊT'
            : 'VERROUILLÉ',
    );
    disable(
      'toggle-' + product.id,
      !line.enabled &&
        ((!line.factories && !line.batch) ||
          (line.remaining <= 0 && !productionUnlocked(state, product))),
    );
    text('toggle-' + product.id, line.enabled ? 'Ⅱ Suspendre' : '▶ Lancer la production');
    text(
      'sell-' + product.id,
      `Vendre ${line.stock} · ${fmt(line.stock * salePrice(state, product))} ◉`,
    );
    disable('sell-' + product.id, !line.stock);
    text('made-' + product.id, `${line.made} unités fabriquées`);
    text('warehouse-' + product.id, `${line.stock} en stock`);
    width(
      'progress-' + product.id,
      line.remaining > 0 ? 100 * (1 - line.remaining / productTime(state, product)) : 0,
    );
  }
}

// Exporte une copie de la sauvegarde au format JSON.
function download() {
  if (!state) return;
  save();
  const url = URL.createObjectURL(
    new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' }),
  );
  const a = document.createElement('a');
  a.href = url;
  a.download = `arsenal-${state.country}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  notify('Sauvegarde exportée.');
}
// Valide le fichier avant de remplacer la partie courante.
function importSave() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.onchange = async () => {
    try {
      const file = input.files[0];
      if (!file || file.size > 100000) throw Error();
      const next = validateSave(await file.text());
      if (state && !confirm('Remplacer votre partie actuelle par cette sauvegarde ?')) return;
      state = next;
      advance(state, Math.max(0, (Date.now() - state.lastSaved) / 1000));
      save();
      last = Date.now();
      document.querySelector('dialog')?.close();
      shell();
      notify('Sauvegarde restaurée.');
    } catch {
      notify('Fichier invalide : choisissez une sauvegarde Arsenal au format JSON.');
    }
  };
  input.click();
}
// Seul le carré lance le délai de survol. La fiche reste ensuite accessible.
document.addEventListener('pointerover', (e) => {
  const square = e.target.closest('.research-square');
  if (!square || e.pointerType === 'touch' || square.contains(e.relatedTarget)) return;
  cancelResearchHover();
  researchHoverSquare = square;
  researchHoverTimer = setTimeout(() => {
    if (researchHoverSquare !== square || !square.isConnected) return;
    square.closest('.research-node').setAttribute('data-preview', 'true');
    square.setAttribute('aria-expanded', 'true');
    researchHoverTimer = null;
  }, 1000);
});
document.addEventListener('pointerout', (e) => {
  const square = e.target.closest('.research-square');
  if (square && !square.contains(e.relatedTarget) && researchHoverSquare === square)
    cancelResearchHover();
  const node = e.target.closest('.research-node');
  if (node && !node.contains(e.relatedTarget)) {
    node.removeAttribute('data-preview');
    node
      .querySelector('.research-square')
      .setAttribute(
        'aria-expanded',
        node.getAttribute('data-pinned') === 'true' ? 'true' : 'false',
      );
  }
});
// Le premier geste clavier peut aussi débloquer le son après un refus d’autoplay.
document.addEventListener('keydown', (event) => {
  if (event.repeat || event.ctrlKey || event.altKey || event.metaKey) return;
  if (!musicPlayer || musicPlayer.paused) syncMusic();
});
// Les boutons décrivent leur action dans leurs attributs data-* ; le moteur la valide.
document.addEventListener('click', (e) => {
  unlockTelegramAudio();
  const button = e.target.closest('button,a');
  if (button?.dataset.action !== 'music-toggle') syncMusic();
  if (!button) return;
  if (button.dataset.marketStep) {
    const id = button.dataset.id;
    if (!state || !RESOURCES.some((resource) => resource.id === id)) return;
    marketQuantities[id] = (marketQuantities[id] ?? 0) + Number(button.dataset.marketStep);
    updateMarketQuantity(id);
    return;
  }
  if (button.dataset.researchNode) {
    pinnedResearch =
      pinnedResearch === button.dataset.researchNode ? null : button.dataset.researchNode;
    renderContent();
    updateNumbers();
    return;
  }
  if (button.dataset.researchClose) {
    pinnedResearch = null;
    renderContent();
    updateNumbers();
    return;
  }
  if (button.dataset.researchJump) {
    pinnedResearch = button.dataset.researchJump;
    renderContent();
    updateNumbers();
    document
      .querySelector(`[data-research-node="${pinnedResearch}"]`)
      ?.scrollIntoView?.({ block: 'center', behavior: 'smooth' });
    return;
  }
  if (button.dataset.productionFilter) {
    productionFilter = button.dataset.productionFilter;
    renderContent();
    updateNumbers();
    return;
  }
  if (button.dataset.country) {
    selected = button.dataset.country;
    title();
    return;
  }
  if (button.dataset.view) {
    view = button.dataset.view;
    shell();
    return;
  }
  const a = button.dataset.action;
  if (!a) return;
  if (a === 'music-toggle') {
    musicEnabled = !musicEnabled;
    try {
      localStorage.setItem('arsenal.music.enabled', String(musicEnabled));
    } catch {}
    syncMusic();
    refreshMusicButtons();
    return;
  }
  if (a === 'telegram-close') {
    closeTelegram();
    return;
  }
  if (a === 'telegram-sound') {
    telegramMuted = !telegramMuted;
    button.textContent = telegramMuted ? 'Son coupé' : 'Son actif';
    button.setAttribute('aria-pressed', String(telegramMuted));
    try {
      localStorage.setItem('arsenal.telegram.muted', String(telegramMuted));
    } catch {}
    if (!telegramMuted) unlockTelegramAudio();
    return;
  }
  if (a === 'start') {
    if (
      state &&
      !confirm(
        'Créer une nouvelle industrie et remplacer la sauvegarde actuelle ? Pensez à l’exporter avant.',
      )
    )
      return;
    state = newGame(selected);
    wagesBlocked = false;
    view = 'harvest';
    last = Date.now();
    save();
    shell();
    return;
  }
  if (a === 'continue') {
    last = Date.now();
    shell();
    if (offlineMessage) {
      notify(offlineMessage);
      offlineMessage = '';
    }
    return;
  }
  if (a === 'home') {
    save();
    title();
    return;
  }
  if (a === 'settings') {
    settings();
    return;
  }
  if (a === 'export') {
    download();
    return;
  }
  if (a === 'import') {
    importSave();
    return;
  }
  if (state && act(state, a, button.dataset.id, marketQuantities[button.dataset.id])) {
    save();
    if (['harvest', 'sell-resource', 'sell-ten', 'sell-all', 'sell-quantity'].includes(a)) {
      updateNumbers();
      return;
    }
    shell();
    if (a === 'patent') notify('Brevet acquis. Votre ligne de production est autorisée.');
  } else notify('Conditions ou ressources insuffisantes.');
});
// Le moteur reçoit le temps écoulé réel, y compris après une pause du navigateur.
setInterval(() => {
  const now = Date.now();
  if (state) {
    const before = state.tech.length,
      completed = state.lines.filter((line) => line.made > 0).length;
    advance(state, (now - last) / 1000);
    checkPayrollNotice();
    if (state.tech.length !== before) {
      if (screen === 'game') shell();
      notify('Recherche terminée : ' + TECHS.find((t) => t.id === state.tech.at(-1)).name);
    } else if (
      screen === 'game' &&
      ['production', 'patents'].includes(view) &&
      completed !== state.lines.filter((line) => line.made > 0).length
    ) {
      shell();
    }
    updateNumbers();
  }
  last = now;
}, 250);
setInterval(save, 5000);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) save();
  if (musicPlayer) syncMusic();
});
window.addEventListener('pagehide', save);
title();
// Tente le démarrage dès l’ouverture ; un refus sera retenté au premier geste.
syncMusic();

    </script>
  </body>
